<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Server · 照片墙</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <h1>Photo Server</h1>
  </div>
  <div class="stats">
    <span id="photo-count">0 张照片</span>
    <span id="live-badge" class="badge">● LIVE</span>
  </div>
</header>

<main>
  <div id="empty" class="empty hidden">
    <div class="empty-icon">📷</div>
    <p>暂无照片</p>
    <p class="sub">相机通过 FTP 上传后将自动出现在这里</p>
  </div>
  <div id="grid" class="grid"></div>
  <div id="load-more-sentinel"></div>
</main>

<!-- 大图查看器 -->
<div id="lightbox" class="lightbox hidden">
  <button class="lb-close" id="lb-close" title="关闭">✕</button>
  <button class="lb-nav lb-prev" id="lb-prev" title="上一张">‹</button>
  <button class="lb-nav lb-next" id="lb-next" title="下一张">›</button>
  <div class="lb-stage">
    <img id="lb-img" alt="">
  </div>
  <div class="lb-info">
    <div class="lb-name" id="lb-name"></div>
    <div class="lb-exif" id="lb-exif"></div>
    <a id="lb-download" class="lb-btn" download>⬇ 下载原图</a>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
