# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# 内存受限环境（空闲约 4GB，页文件仅 3GB，系统 commit 上限约 17GB 已满）：
# SerialGC 减少 GC 线程 native 开销；单 C2 编译器线程；小代码缓存；小线程栈；
# 堆基址抬到 4GB 以上腾出低地址；Xmx 压到最小给 native 腾空间
org.gradle.jvmargs=-Xmx640m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -XX:HeapBaseMinAddress=0x100000000 -XX:CICompilerCount=2 -XX:ReservedCodeCacheSize=48m -XX:TieredStopAtLevel=1 -Xss512k -Dfile.encoding=UTF-8
# Kotlin 编译守护进程内存上限（防止与 Gradle 守护进程叠加导致系统 OOM）
# 同样用 SerialGC + HeapBaseMinAddress + 单编译器线程，避免 daemon 崩溃
# Kotlin 编译器守护进程：真正在 compileDebugKotlin 阶段吃内存并崩在 native 的 JVM。
# 单独关闭 CompressedOops（-XX:-UseCompressedOops），让堆与 native 都能用满 64 位地址空间、
# 互不挤占低 4GB；该 flag 不放 org.gradle.jvmargs 是因为会和被工具链探测强加的
# +UseCompressedOops 冲突导致“找不到 JDK”。Gradle 守护进程(编排)仍保留 compressed oops。
kotlin.daemon.jvmargs=-Xmx896m -XX:MaxMetaspaceSize=320m -XX:+UseSerialGC -XX:-UseCompressedOops -XX:HeapBaseMinAddress=0x100000000 -XX:CICompilerCount=2 -XX:ReservedCodeCacheSize=48m -XX:TieredStopAtLevel=1 -Xss512k
# 不使用 in-process：让 Kotlin 编译器跑在独立的 Kotlin 守护进程里，
# 避免 Gradle 守护进程同时加载 Gradle + Kotlin 编译器两类巨量类导致 native 地址空间叠加撑爆。
# 独立 Kotlin 守护进程用下方 kotlin.daemon.jvmargs 严格限制内存与 GC。
# kotlin.compiler.execution.strategy=in-process
# 限制并发 worker，降低峰值内存
org.gradle.workers.max=1
org.gradle.parallel=false
# AGP 9.x 内置 Kotlin 模式下，允许 KSP 将生成目录加入 kotlin.sourceSets
# 否则 Room 的 KSP 生成目录会触发 "Using kotlin.sourceSets DSL to add Kotlin sources
# is not allowed with built-in Kotlin" 错误
android.disallowKotlinSourceSets=false
# 使用本地 JDK 21，禁止 Gradle 从 foojay 自动下载工具链（该源在本地网络极慢）
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.paths=***REMOVED***
org.gradle.java.home=***REMOVED***
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
# 关闭 configuration cache：避免 Gradle 守护进程加载 instrumentation agent（显著 native 开销），
# 在内存受限环境下降低守护进程崩溃概率（代价是配置阶段略慢）
org.gradle.configuration-cache=false
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official